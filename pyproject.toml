[project]
name = "covid-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan Carlos", email = "juancho131401@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyshp>=3.1.6",
    "streamlit>=1.62.0",
]

[project.scripts]
covid-analytics = "covid_analytics.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["shapefile", "plotly.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["."]
